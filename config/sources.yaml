# 数据源清单。新增源只需改这里，不用改代码。
sources:
  # raw 源：GitHub Actions 中可达。本地调试若 raw 不可达，可临时把地址换成
  # https://fastly.jsdelivr.net/gh/{owner}/{repo}@{branch}/{path}（勿长期启用，会重复抓取）
  - type: github
    timeout: 15
    urls:
      - https://raw.githubusercontent.com/freefq/free/master/v2
      - https://raw.githubusercontent.com/ripaojiedian/freenode/main/sub
      - https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml
      - https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml
      - https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity
      - https://raw.githubusercontent.com/zhangkaiitugithub/passcro/main/speednodes.yaml
      - https://raw.githubusercontent.com/hermanb001/ProxyTest/main/subscribe/jingfu
      - https://raw.githubusercontent.com/hermanb001/ProxyTest/main/subscribe/hellopool
      - https://raw.githubusercontent.com/YasserDivaR/pr0xy/main/ShadowSocks2021.txt
      - https://raw.githubusercontent.com/xiyaowong/freeFQ/main/v2ray
      - https://raw.githubusercontent.com/ssrsub/ssr/master/v2ray
      - https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt

  # 第三方聚合订阅（Clash 格式），五层过滤会再筛一遍
  - type: subscription
    timeout: 25
    url: https://leidahub.top/clash.yaml

  # Telegram 公开频道（频道名不含 @）。t.me/s 预览页免凭据，CI 环境可达。
  # 只收「正文带明文节点」的频道：抓取为空时 report.failed_sources 会带诊断
  # （bytes/messages/uri_in_html/documents/link_hosts），据此判断是附件型还是跳转型。
  # 已移除 freenodedaily、ripaojiedian：页面有几百条消息但 uri_in_html=0，
  # 属于附件/图片型，公开途径拿不到节点。free-nodes 则是频道不存在。
  # 已排除 VPNzhilian：正文发的是 tg://proxy（MTProto 代理），不是可导入的节点。
  - type: telegram
    timeout: 20
    max_pages: 3
    channels:
      - PrivateVPNs       # 实测 3 页 52 节点（vless）
      - VlessConfig       # 实测 3 页 52 节点（vless）；与 PrivateVPNs 同源，仅端口不同
      - clashv8           # 实测 3 页 50 节点（ss），41 个通过静态检查
      - xlyv2ray          # 实测 3 页 61 节点（hysteria2 为主）

  # 全量频道：来自 denxv/TGV2RayScraper 的 channels/urls.txt（173 个频道，
