# 过滤策略。strict 会剔除自签/无效证书的节点；free 节点较多时可视情况改 loose。
tls_policy: strict

probe_concurrency: 150
probe_timeout_s: 3
tcp_fail_threshold: 2
max_handshake_ms: 3000

max_nodes_total: 300
max_nodes_per_group: 30

# 真实连通测试（需 mihomo 内核）：每个节点采样次数与成功率阈值
alive_samples: 1
alive_min_success_rate: 1.0
alive_timeout_ms: 4000
alive_concurrency: 120
# 分批测试时若有批次失败，未测到的节点默认剔除（未经任何验证，不该进最终列表）
alive_allow_untested: false

# 出口 IP 探测：经每个存活节点请求 cloudflare trace，拿真实出口地址。
# CDN 中转节点的 server 解析地址是入口，不代表出口；关掉可省一轮请求。
exit_probe: true
exit_probe_timeout_ms: 5000
exit_probe_concurrency: 30

dnsbl_zones:
  - zen.spamhaus.org
reputation_enabled: true

# 出口 IP 情报与分级标签：只对通过 alive 的节点查询，量级受最终数量约束。
# 入口 IP 已由上面的 reputation 查过一次，这里针对真实出口再查，覆盖 CDN 中转。
intel_enabled: true
latency_fast_ms: 300
latency_slow_ms: 800
intel_batch_size: 100
# 每个列表的命中数会写进 report.stats.tagging.dnsbl_by_zone，据此再删误伤严重的。
# 已移除：uceprotect（免费查询常直接返回命中）、psbl.surriel.com（2019 年停维护）、
# spam.spamrats.com（对未注册用户不稳定）、all.s5h.net（2026-11-26 实测命中 125/221，
# 对共享 IP 收录过宽，把 ip_score 压到平均 34，而同期 spamhaus 命中 0）。
intel_dnsbl_zones:
  - zen.spamhaus.org
  - bl.spamcop.net
  - bl.blocklist.de
  - dnsbl.dronebl.org
