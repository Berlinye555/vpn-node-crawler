# 过滤策略。strict 会剔除自签/无效证书的节点；free 节点较多时可视情况改 loose。
tls_policy: strict

probe_concurrency: 150
probe_timeout_s: 3
tcp_fail_threshold: 2
max_handshake_ms: 3000

max_nodes_total: 300
max_nodes_per_group: 30

# 真实连通测试（需 mihomo 内核）：每个节点采样次数与成功率阈值
alive_samples: 1
alive_min_success_rate: 1.0
alive_timeout_ms: 4000
alive_concurrency: 120

# 出口 IP 探测：经每个存活节点请求 cloudflare trace，拿真实出口地址。
# CDN 中转节点的 server 解析地址是入口，不代表出口；关掉可省一轮请求。
exit_probe: true
exit_probe_timeout_ms: 5000
exit_probe_concurrency: 30

dnsbl_zones:
  - zen.spamhaus.org
reputation_enabled: true

# 出口 IP 情报与分级标签：只对通过 alive 的节点查询，量级受最终数量约束。
# 入口 IP 已由上面的 reputation 查过一次，这里针对真实出口再查，覆盖 CDN 中转。
intel_enabled: true
latency_fast_ms: 300
latency_slow_ms: 800
intel_batch_size: 100
intel_dnsbl_zones:
  - zen.spamhaus.org
  - bl.spamcop.net
  - psbl.surriel.com
  - bl.blocklist.de
  - dnsbl-1.uceprotect.net
  - all.s5h.net
  - dnsbl.dronebl.org
  - spam.spamrats.com
