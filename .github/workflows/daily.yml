name: daily-crawl

on:
  schedule:
    # 21:17 UTC = 北京时间 05:17
    - cron: "17 21 * * *"
  workflow_dispatch:
  # 代码改动自动验证一轮。output/ 是 CI 自己提交的产物，必须排除，
  # 否则 commit→触发→commit 会无限循环。
  push:
    branches: [main]
    paths-ignore:
      - "output/**"

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 内核缺失时必须让任务失败：跳过真实测试会发布一批从未验证过的节点
      - name: Install mihomo core
        run: |
          URL=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-v[0-9].*\\.gz$")) | .browser_download_url' \
            | head -1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::无法解析 mihomo 下载地址"
            exit 1
          fi
          echo "downloading: $URL"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o mihomo.gz "$URL" \
            || curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o mihomo.gz "https://gh-proxy.com/$URL"
          gunzip -f mihomo.gz && chmod +x mihomo && ./mihomo -v

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -x ./mihomo ]; then
            echo "::error::mihomo 不可执行，拒绝发布未经真实测试的节点"
            exit 1
          fi
          python -m vpnnode.pipeline --out output --no-upload --mihomo ./mihomo

      - name: Commit and push outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "no output changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update nodes $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in clash.yaml sub.base64; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/output/$f" \
              && echo "purged $f" || echo "purge failed: $f"
          done

      - name: Upload artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-nodes-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
