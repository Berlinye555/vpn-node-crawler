name: daily-crawl

on:
  schedule:
    # 21:17 UTC = 北京时间 05:17
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          SUB_ACCESS_KEY: ${{ secrets.SUB_ACCESS_KEY }}
        run: python -m vpnnode.pipeline --out output

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-nodes-${{ github.run_id }}
          path: output/
          retention-days: 7
